<!DOCTYPE html>
<html>
<head>
  <title>Eikazo Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .product {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    button {
      background: green;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    #cart {
      margin-top: 20px;
      background: white;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<h1>QuickMart Store</h1>

<div class="product">
  <h3>Rice 1kg</h3>
  <p>₹60</p>
  <button onclick="addToCart('Rice 1kg',60)">Add to Cart</button>
</div>

<div class="product">
  <h3>Oil 1L</h3>
  <p>₹140</p>
  <button onclick="addToCart('Oil 1L',140)">Add to Cart</button>
</div>

<div class="product">
  <h3>Aata 5kg</h3>
  <p>₹250</p>
  <button onclick="addToCart('Aata 5kg',250)">Add to Cart</button>
</div>

<div id="cart">
  <h2>Cart</h2>
  <ul id="cartItems"></ul>
  <p><strong>Total: ₹<span id="total">0</span></strong></p>
  <button onclick="checkout()">Checkout</button>
</div>

<script>
  let total = 0;

  function addToCart(name, price) {
    let item = document.createElement("li");
    item.textContent = name + " - ₹" + price;
    document.getElementById("cartItems").appendChild(item);
    total += price;
    document.getElementById("total").innerText = total;
  }

  function checkout() {
    alert("Order Placed Successfully!");
  }
</script>

</body>
</html>
