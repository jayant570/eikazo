
<!DOCTYPE html>
<html>
<head>
<title>Eikazo Express</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f8f8f8;
}

.header{
  background:#0f172a;
  color:white;
  padding:15px;
  font-size:18px;
  font-weight:bold;
  text-align:center;
}

.search{
  padding:10px;
  background:white;
}

.search input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ddd;
}

.categories{
  display:flex;
  overflow-x:auto;
  padding:10px;
  gap:10px;
}

.category{
  background:#e2e8f0;
  padding:8px 12px;
  border-radius:20px;
  font-size:13px;
  white-space:nowrap;
  cursor:pointer;
}

.container{
  padding:10px;
  margin-bottom:90px;
}

.product{
  background:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.product-info{
  width:70%;
}

.product h4{
  margin:0;
  font-size:14px;
}

.price{
  font-size:13px;
  color:#666;
}

.qty-btn{
  display:flex;
  align-items:center;
  gap:5px;
}

button{
  background:#10b981;
  border:none;
  color:white;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.cart-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#10b981;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
  Eikazo Express
</div>

<div class="search">
  <input type="text" placeholder="Search products...">
</div>

<div class="categories">
  <div class="category">Fruits</div>
  <div class="category">Vegetables</div>
  <div class="category">Dairy</div>
  <div class="category">Snacks</div>
  <div class="category">Beverages</div>
  <div class="category">Atta Rice Oil</div>
  <div class="category">Personal Care</div>
  <div class="category">Household</div>
</div>

<div class="container" id="productList"></div>

<div class="cart-bar" onclick="checkout()">
  <div><span id="itemCount">0</span> Items</div>
  <div>Total ₹<span id="total">0</span></div>
</div>

<script>

let products = [
  {name:"Rice 1kg", price:60},
  {name:"Aata 5kg", price:250},
  {name:"Mustard Oil 1L", price:160},
  {name:"Milk 500ml", price:28},
  {name:"Curd 400g", price:40},
  {name:"Bread", price:35},
  {name:"Eggs 12pcs", price:75},
  {name:"Banana 1 dozen", price:50},
  {name:"Apple 1kg", price:120},
  {name:"Potato 1kg", price:30},
  {name:"Onion 1kg", price:35},
  {name:"Tomato 1kg", price:40},
  {name:"Maggi Pack", price:14},
  {name:"Biscuits", price:25},
  {name:"Chips", price:20},
  {name:"Cold Drink 1L", price:45},
  {name:"Toothpaste", price:55},
  {name:"Soap", price:35},
  {name:"Shampoo", price:99},
  {name:"Detergent 1kg", price:110},
  {name:"Floor Cleaner", price:95},
  {name:"Sugar 1kg", price:45},
  {name:"Salt 1kg", price:20},
  {name:"Tea 250g", price:90},
  {name:"Coffee 100g", price:120}
];

let cart = [];

function renderProducts(){
  let container = document.getElementById("productList");
  container.innerHTML = "";

  products.forEach((product,index)=>{
    container.innerHTML += `
      <div class="product">
        <div class="product-info">
          <h4>${product.name}</h4>
          <div class="price">₹${product.price}</div>
        </div>
        <div class="qty-btn">
          <button onclick="addToCart(${index})">Add</button>
        </div>
      </div>
    `;
  });
}

function addToCart(index){
  let product = products[index];
  let existing = cart.find(item=>item.name===product.name);

  if(existing){
    existing.qty +=1;
  }else{
    cart.push({name:product.name, price:product.price, qty:1});
  }

  updateCart();
}

function updateCart(){
  let total=0;
  let count=0;

  cart.forEach(item=>{
    total += item.price * item.qty;
    count += item.qty;
  });

  document.getElementById("total").innerText = total;
  document.getElementById("itemCount").innerText = count;

  localStorage.setItem("cart", JSON.stringify(cart));
}

function checkout(){
  if(cart.length===0){
    alert("Cart is empty");
    return;
  }
  window.location.href="checkout.html";
}

window.onload=function(){
  renderProducts();
  let saved=JSON.parse(localStorage.getItem("cart"));
  if(saved){
    cart=saved;
    updateCart();
  }
}

</script>

</body>
</html>
