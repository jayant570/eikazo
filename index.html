<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eikazo Express</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f4f4f4;
}

header{
  background:#6c2bd9;
  color:white;
  padding:15px;
  font-size:18px;
  font-weight:bold;
}

.search{
  padding:10px;
  background:white;
}

.search input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ddd;
}

.categories{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
  background:white;
}

.category{
  background:#eee;
  padding:8px 14px;
  border-radius:20px;
  font-size:13px;
  white-space:nowrap;
}

.container{
  padding:10px;
  margin-bottom:90px;
}

.product{
  background:white;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.product-info{
  width:65%;
}

.product h4{
  margin:0;
  font-size:15px;
}

.product p{
  margin:4px 0 0 0;
  color:#555;
  font-size:13px;
}

.add-btn{
  background:#16a34a;
  color:white;
  border:none;
  padding:8px 14px;
  border-radius:8px;
}

.qty-control{
  display:flex;
  align-items:center;
  gap:10px;
}

.qty-control button{
  background:#16a34a;
  color:white;
  border:none;
  padding:5px 10px;
  border-radius:6px;
}

.cart-bar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#16a34a;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<header>Eikazo Express</header>

<div class="search">
<input type="text" placeholder="Search products...">
</div>

<div class="categories">
<div class="category">Fruits</div>
<div class="category">Vegetables</div>
<div class="category">Dairy</div>
<div class="category">Snacks</div>
<div class="category">Beverages</div>
<div class="category">Grocery</div>
</div>

<div class="container" id="productList"></div>

<div class="cart-bar hidden" id="cartBar" onclick="checkout()">
<span id="cartCount">0 Items</span>
<span>Total ₹<span id="total">0</span></span>
</div>

<script>
const products = [
{name:"Rice 1kg", price:60},
{name:"Aata 5kg", price:250},
{name:"Mustard Oil 1L", price:160},
{name:"Milk 500ml", price:28},
{name:"Curd 400g", price:40},
{name:"Bread", price:35},
{name:"Eggs 12pcs", price:75},
{name:"Banana 1 dozen", price:50},
{name:"Apple 1kg", price:120},
{name:"Potato 1kg", price:30},
{name:"Tomato 1kg", price:35},
{name:"Onion 1kg", price:32},
{name:"Coke 1L", price:45},
{name:"Chips", price:20},
{name:"Maggi", price:14}
];

let cart = {};
let total = 0;

const productList = document.getElementById("productList");

products.forEach((p,i)=>{
  const div = document.createElement("div");
  div.className="product";
  div.innerHTML=`
    <div class="product-info">
      <h4>${p.name}</h4>
      <p>₹${p.price}</p>
    </div>
    <button class="add-btn" onclick="addToCart(${i})">Add</button>
  `;
  productList.appendChild(div);
});

function addToCart(index){
  const product = products[index];
  if(!cart[index]){
    cart[index]=1;
  }else{
    cart[index]++;
  }
  updateCart();
}

function updateCart(){
  total=0;
  let count=0;
  for(let i in cart){
    total += products[i].price * cart[i];
    count += cart[i];
  }
  document.getElementById("total").innerText=total;
  document.getElementById("cartCount").innerText=count+" Items";
  if(count>0){
    document.getElementById("cartBar").classList.remove("hidden");
  }
}

function checkout(){
  alert("Checkout system coming in next phase 🚀");
}
</script>

</body>
</html>
